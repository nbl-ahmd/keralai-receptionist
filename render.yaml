# render.yaml
#
# Render deployment configuration for the KeralAI Receptionist bridge.
#
# The bridge is a standalone, pure Node.js Web Service (no Next.js). It connects
# to Neon Postgres via the POOLED (PgBouncer) connection string and relays audio
# between Exotel/browser and Gemini Live over WebSockets.
#
# The bridge is TENANT-AWARE: it resolves the tenant from the WebSocket URL
# (/ws/exotel/<slug>?token=... or /ws/browser?token=...) before touching the
# database, then uses that tenant's encrypted provider credentials. There is no
# global Gemini API key — each tenant supplies its own in the dashboard.
#
# The Next.js dashboard deploys separately (e.g. Vercel).
#
# To deploy:
#   1. Push this repo to GitHub / GitLab.
#   2. In the Render dashboard: New → Blueprint → point to this repo.
#      Render will pick up this file automatically.
#   3. Set the secret env vars (DATABASE_URL, BRIDGE_AUTH_SECRET,
#      TENANT_SECRETS_ENCRYPTION_KEY) in the Render dashboard under the
#      service's "Environment" tab. The two tenant secrets MUST match the
#      values used by the Next.js app.
#
# After deploying:
#   - Your bridge URL will be: https://<service-name>.onrender.com
#   - Copy the tenant-specific Exotel WebSocket URL from the dashboard
#     (Settings → Providers → Exotel routing) into your Exotel Voicebot applet:
#       wss://<service-name>.onrender.com/ws/exotel/<tenant-slug>?token=<token>
#     The bare path /ws/exotel is rejected; there is no default tenant.

services:
  - type: web
    name: keralai-bridge
    runtime: node
    # The bridge is self-contained: bridge/package.json owns its (small) runtime
    # dependency graph and there is no Next.js build step.
    rootDir: bridge
    buildCommand: npm ci
    startCommand: node server.mjs
    healthCheckPath: /ping

    # Render injects PORT automatically — do not set it here.
    envVars:
      - key: NODE_ENV
        value: production

      # ── Required secrets (set in Render dashboard, NOT here) ──────────────
      - key: DATABASE_URL
        sync: false   # Must be the Neon POOLED (PgBouncer) connection string
      - key: BRIDGE_AUTH_SECRET
        sync: false   # MUST match the Next.js dashboard value
      - key: TENANT_SECRETS_ENCRYPTION_KEY
        sync: false   # MUST match the Next.js dashboard value

      # ── Optional: phone bridge behaviour ──────────────────────────────────
      # - key: EXOTEL_SAMPLE_RATE
      #   value: "8000"        # 8000 (default) or 16000
      # - key: MAYA_VOICE
      #   value: Aoede         # Aoede | Kore | Zephyr | Puck | Fenrir | Charon
      # - key: MAYA_PITCH
      #   value: Normal        # Low | Normal | High
      # - key: MAYA_SPEED
      #   value: Normal        # Slow | Normal | Fast
      # - key: PG_POOL_MAX
      #   value: "10"

      # ── Optional: Gemini model fallbacks (per-tenant keys come from the DB) ─
      # - key: GEMINI_MODEL
      #   value: gemini-3.8-live
      # - key: GEMINI_EMBEDDING_MODEL
      #   value: gemini-embedding-2

      # ── Optional: browser voice relay ────────────────────────────────────
      # - key: PUBLIC_APP_ORIGIN
      #   value: https://your-vercel-app.vercel.app
      # - key: BROWSER_MAX_SESSIONS_PER_IP
      #   value: "3"
      # - key: BROWSER_SESSION_TTL_MS
      #   value: "900000"      # 15 minutes

      # ── Optional: latency debugging ───────────────────────────────────────
      # - key: DEBUG_TIMING
      #   value: "1"           # Enables per-operation latency logs
