name: Alpha validation
on:
  pull_request:
  push:
    branches: [main, feat/full-alpha]
permissions:
  contents: read
concurrency:
  group: alpha-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: keralai_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:fixture-only@localhost:5432/keralai_test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            bridge/package-lock.json
      - run: npm ci
      - run: npm ci --prefix bridge
      - run: npm run lint
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test
      - run: find bridge scripts -name '*.mjs' -not -path '*/node_modules/*' -print0 | xargs -0 -n1 node --check
      - run: npm run build
      - run: npm run test:bridge-smoke
      - run: mkdir -p .test-output
      - run: npm run test:integration 2>&1 | tee .test-output/integration.log
      - run: npm run test:did-exposure
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: alpha-test-failures
          path: |
            .test-output/results
            .test-output/integration.log
          retention-days: 7
